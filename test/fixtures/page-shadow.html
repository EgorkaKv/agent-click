<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Shadow and frame fixture</title>
<style> body { margin: 0; } </style>
</head>
<body>
<my-widget></my-widget>
<iframe id="f" style="position:absolute; left:100px; top:200px; width:300px; height:150px; border:5px solid red; padding:10px"
  srcdoc="<div style='height:50px'></div><button>Inside frame</button>"></iframe>
<script>
  const host = document.querySelector('my-widget');
  const root = host.attachShadow({ mode: 'open' });
  root.innerHTML = '<div style="margin-top:30px"><button>Shadow button</button></div>';
</script>
</body>
</html>
