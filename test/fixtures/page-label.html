<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Label occlusion fixture</title>
<style>
  body { margin: 0; font: 14px sans-serif; }
  /* Custom controls: the native input is invisible, its label is drawn. */
  input[type=radio], input[type=checkbox] { position: absolute; opacity: 0; width: 16px; height: 16px; margin: 0; }
  label { position: absolute; padding: 4px 8px; }
  #lab-radio { left: 60px; top: 20px; }
  #lab-check { left: 60px; top: 80px; }
  #lab-cover { left: 60px; top: 200px; }
  #cover { position: fixed; left: 0; top: 190px; width: 300px; height: 40px; background: #fff; }
</style>
</head>
<body>
<input type="radio" id="r1" name="size" style="left:20px;top:20px">
<label id="lab-radio" for="r1"><span>Large</span></label>

<label id="lab-check"><input type="checkbox" id="c1" style="left:0;top:0"><span>Agree</span></label>

<input type="radio" id="r2" name="size2" style="left:20px;top:200px">
<label id="lab-cover" for="r2"><span>Covered</span></label>
<div id="cover">Cover</div>
</body>
</html>
